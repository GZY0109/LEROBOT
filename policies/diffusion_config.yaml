# Diffusion Policy configuration
# Reference: Chi et al., "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"

policy:
  name: diffusion_policy
  type: diffusion

model:
  # U-Net noise prediction network
  backbone: unet1d
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 256

  # Diffusion process
  num_diffusion_steps: 100
  noise_schedule: squaredcos_cap_v2
  prediction_type: epsilon       # Predict noise (vs. sample)
  clip_sample: true

  # Vision encoder
  vision_encoder: resnet18
  vision_feature_dim: 512
  spatial_softmax: true

action:
  action_chunk_size: 16          # Prediction horizon
  action_dim: 7                  # 6-DoF + gripper
  n_action_steps: 8              # Execute first n steps before re-planning

observation:
  observation_window: 2          # Number of past observations to condition on
  image_size: [480, 640]
  image_channels: 3
  use_depth: false
  state_dim: 14

training:
  batch_size: 256
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6
  num_epochs: 3000
  lr_scheduler: cosine
  warmup_epochs: 100
  gradient_clip: 1.0
  ema_decay: 0.999               # Exponential moving average for model weights

  # DDPM training
  loss: mse

inference:
  num_inference_steps: 16        # DDIM accelerated sampling
  scheduler: ddim

data:
  dataset_format: lerobot
  normalize_actions: true
  normalize_observations: true